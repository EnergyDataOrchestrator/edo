[project]
name = "edo"
version = "0.2.0"
description = "Energy Data Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "linkml>=1.11.1",
    "linkml-map>=0.5.2",
    "openai>=3.46.0",
    "quantulum3[classifier]>=0.10.0",
    "schema-automator>=0.5.5",
    "regimo-core",  # local submodule core/: ontology-aware Kafka bus library
    "fuseki-proto-tool",  # local: infrastructure/fuseki-proto/tool (maDMP -> internal format)
]

[tool.uv.sources]
regimo-core = { path = "core", editable = true }
fuseki-proto-tool = { path = "infrastructure/fuseki-proto/tool", editable = true }
