services:
  # --- INFRASTRUCTURE LAYER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- SEMANTIC LAYER (Schema Registry) ---
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'

  # --- LOGIC LAYER (Functional Sockets) ---
  socket-rdmo:
    build:
      context: ./components/socket-rdmo
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - schema-registry
    volumes:
      # Mount the ontology so the socket is 'ontology-aware' at runtime
      - ./schema/ontology:/app/ontology:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      RDMO_API_TOKEN: ${RDMO_API_TOKEN}
      ONTOLOGY_PATH: "/app/ontology/regimo.ttl"

  # Example of another functional unit
  socket-pv-data:
    build:
      context: ./components/socket-sms
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # socket-ux — ontology-aware socket presenting the API for the vue-frontend:
  # projects & values from the internal graph database (Fuseki) and on-demand
  # RO-Crate generation for NovaCrate.
  socket-ux:
    build:
      context: ./components/socket-ux
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8090:8090"
    volumes:
      # Mount the ontology so the socket is 'ontology-aware' at runtime
      - ./schema/ontology:/app/ontology:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ONTOLOGY_PATH: "/app/ontology/regimo.ttl"
      FUSEKI_URL: "http://host.docker.internal:3031"
      FUSEKI_DATASET: "projects"
      FUSEKI_USER: "admin"
      FUSEKI_PASSWORD: "edo-proto"

  # novacrate — self-hosted NovaCrate editor for iframe embedding (CF3).
  # Iframe mode is disabled on the official instance, so we build from source
  # (pinned tag) with the parent-page origin baked in at build time —
  # see components/novacrate docs: https://github.com/kit-data-manager/NovaCrate
  novacrate:
    build:
      context: https://github.com/kit-data-manager/NovaCrate.git#v1.14.2
      args:
        IFRAME_TARGET_ORIGIN: "http://localhost:5173"
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  default:
    name: regimo-network